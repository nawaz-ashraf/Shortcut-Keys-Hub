name: shortcut_keys_hub
description: Premium offline keyboard shortcuts hub.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_animate: ^4.5.0
  flutter_neumorphic_plus: ^3.3.0
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  intl: ^0.20.2
  collection: ^1.18.0
  share_plus: ^9.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/lottie/
    - assets/images/
    - assets/icons/
